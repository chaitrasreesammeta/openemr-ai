name: Coding Bench Smoke

# Tier 0 only. This workflow never runs inference, and structurally cannot:
# it is given no Modal token and no provider key, so there is nothing for it to
# call and no bill it can run up. Every cached prediction on the results volume
# stays exactly where it is.
#
# Re-running inference is the job of coding-bench-full.yml, which is manual and
# which reuses the prediction cache: a note is only regenerated when something
# that can change its answer changed, which is the gold manifest checksum, the
# model, the adapter, the prompt, the candidate list or the run parameters. See
# the key in coding_bench/bench/cache.py.
#
# What this catches, and why it is worth a minute of runner time:
#   * thirteen reporting tests were broken by one commit and sat that way,
#     because nothing ran the suite
#   * LEADERBOARD.md says in its own header that CI regenerates it and fails on
#     drift, which was not true of any workflow until this one
#   * a run record carrying note text would be a disclosure, and the guard rail
#     existed with nothing running it

on:
  push:
    paths:
      - 'coding_bench/**'
      - '.github/workflows/coding-bench-smoke.yml'
  pull_request:
    paths:
      - 'coding_bench/**'
      - '.github/workflows/coding-bench-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The restricted data scan diffs against main, so the merge base has
          # to be present. A shallow clone would silently scan nothing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        # `modal` is the client library, not a credential. Installing it lets
        # the adapter tests import and check the model ids and the declared
        # adapter equivalences, which are skipped without it. With no token set
        # it still cannot reach anything.
        run: pip install -e './coding_bench[dev,modal]'

      - name: Tests
        run: python -m pytest coding_bench/tests -q

      - name: Leaderboard is current
        # Regenerating by hand and forgetting to commit the result is the
        # ordinary way a leaderboard starts lying.
        run: python -m coding_bench.bench.reporting --check

      - name: No restricted data
        # Scoped to coding_bench rather than the whole repo. The other
        # benchmarks here carry result files above the 1 MB ceiling this scan
        # enforces, and failing this job on those would teach everyone to
        # ignore it. `xargs -r` so that a run with no changed files under
        # coding_bench passes instead of scanning the entire tree.
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- coding_bench \
            | xargs -r python coding_bench/scripts/check_restricted.py
