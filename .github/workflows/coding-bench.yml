name: Coding Bench

# One workflow, two jobs, because the second must not run when the first fails.
#
# Split across two files, `checks` and `evaluate` ran in parallel, so a commit
# that broke the test suite still triggered paid inference: the tests went red
# at minute one while the evaluation spent twenty dollars discovering the same
# thing at minute thirty. `needs: checks` closes that.
#
# The two jobs do genuinely different work and neither is redundant:
#
#   checks    Tier 0 only. No Modal token, no provider key, so it structurally
#             cannot run inference or spend anything. Runs on pull requests too.
#   evaluate  Tier 2. Runs the leaderboard set against Modal and commits the
#             records. Never runs on a pull request: a fork PR cannot have the
#             secrets anyway, and paying for a stranger's branch is not a thing
#             this repo should do.
#
# ## Why evaluating on every push is affordable
#
# The prediction cache means an evaluation is only expensive the first time. A
# note is regenerated only when something that can change its answer changed:
# the gold manifest checksum, the model, the adapter file hash, the prompt hash,
# the offered candidate list, or the run parameters. A push that edits a
# docstring re-runs the whole set for the price of container time; a push that
# edits an adapter pays for that model's notes and no others.
#
# The exception is a change to the prompt in `approaches/llm.py` or to the gold
# manifests, which are in *every* model's cache key. `evaluate` refuses to do
# that from a push and asks for a manual dispatch with `confirm_full_rerun`, so
# a whole-leaderboard re-run is always someone's decision.
#
# GPU models are not in the push set. Muse and Gemma take hours and run as
# detached chains that outlive any client; dispatch with `action: collect` to
# bank one that has finished.
#
# Credentials: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET only. The provider keys are
# Modal secrets (`groq-api`, `anthropic-api`) that eval_remote.py declares and
# Modal resolves server side, so no provider key passes through GitHub.

on:
  push:
    paths:
      - 'coding_bench/**'
      - '.github/workflows/coding-bench.yml'
  pull_request:
    paths:
      - 'coding_bench/**'
      - '.github/workflows/coding-bench.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'evaluate the hosted set, or collect finished detached runs'
        type: choice
        options: [evaluate, collect]
        default: evaluate
      only:
        description: 'substring filter over the run set, e.g. sonnet or icd10. Empty runs all.'
        type: string
        default: ''
      confirm_full_rerun:
        description: 'required when the prompt or gold set changed; re-runs every model'
        type: boolean
        default: false
      concurrency:
        description: 'in flight requests per run; Groq saturates around 2 to 3'
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: coding-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The restricted data scan diffs against main, so the merge base has
          # to be present.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        # `modal` and `anthropic` are client libraries, not credentials.
        # Installing them lets the adapter tests import and check model ids,
        # stop reasons and the declared adapter equivalences, which are skipped
        # without them. With no token set they still cannot reach anything.
        run: pip install -e './coding_bench[dev,modal,anthropic]'

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          python -m pytest coding_bench/tests -q 2>&1 | tee /tmp/pytest.log

      - name: Metrics match the predictions
        id: rescore
        # A change to metrics.py does not need an inference run: every
        # prediction is already committed. The fix this names costs nothing.
        run: python -m coding_bench.bench.rescore --check

      - name: Leaderboard is current
        id: leaderboard
        run: python -m coding_bench.bench.reporting --check

      - name: No restricted data
        id: restricted
        # Scoped to coding_bench: the other benchmarks here carry result files
        # over the 1 MB ceiling, and failing on those would teach everyone to
        # ignore this. `xargs -r` so a run with no changed files passes.
        run: |
          set -o pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- coding_bench \
            | xargs -r python coding_bench/scripts/check_restricted.py | tee /tmp/restricted.log

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, re

          def read(path, default=""):
              p = pathlib.Path(path)
              return p.read_text(encoding="utf8") if p.exists() else default

          def leaders(board):
              """The winning row under each `### task, space` heading.

              The full board is four ranked tables and two band sections, which
              is more than a summary should carry. This is the line someone
              actually decides on, one per condition, and the link below reaches
              the rest.
              """
              # Scoped to the Results section: Frequency bands uses `###` per
              # run too, and those rows are not leaders of anything.
              section = re.search(r"^## Results$(.*?)(?=^## |\Z)", board, re.M | re.S)
              if not section:
                  return []
              out, heading = [], None
              for line in section.group(1).splitlines():
                  if line.startswith("### "):
                      heading = line[4:].strip()
                  elif heading and line.startswith("|"):
                      if set(line) <= set("|-: "):
                          continue
                      cells = [c.strip() for c in line.strip("|").split("|")]
                      if cells and cells[0] == "Model":
                          continue
                      out.append(cells)
                      heading = None
              return out

          def quarantine_rows(board):
              """Rows of the quarantine table: model, task, space, n, failed, trunc, f1."""
              match = re.search(r"^## Quarantined runs$(.*?)(?=^## |\Z)", board, re.M | re.S)
              out = []
              for line in (match.group(1).splitlines() if match else []):
                  if not line.startswith("|") or set(line) <= set("|-: "):
                      continue
                  cells = [c.strip() for c in line.strip("|").split("|")]
                  if cells and cells[0] != "Model":
                      out.append(cells)
              return out

          def leader_table(board):
              def cell(c, i):
                  return c[i] if len(c) > i else ""

              rows = {}
              for c in leaders(board):
                  rows[(cell(c, 1), cell(c, 2))] = [
                      cell(c, 1), cell(c, 2), cell(c, 0), cell(c, 3), cell(c, 4), cell(c, 10), "valid",
                  ]

              # A condition where every attempt was quarantined has no entry in
              # Results at all, so it would vanish from this table and read as
              # untried. Show the best attempt with the failure rate attached,
              # which is the one thing that stops the number being taken as a score.
              for c in sorted(quarantine_rows(board), key=lambda c: cell(c, 6), reverse=True):
                  key = (cell(c, 1), cell(c, 2))
                  if key in rows:
                      continue
                  rows[key] = [
                      cell(c, 1), cell(c, 2), cell(c, 0), cell(c, 3), cell(c, 6), "",
                      f"QUARANTINED, {cell(c, 4)} of notes failed",
                  ]

              if not rows:
                  return
              print("### Best model per condition")
              print()
              print("| Task | Candidates | Best model | n | Micro F1 [95% CI] | Latency | Status |")
              print("|---|---|---|---:|---|---:|---|")
              for key in sorted(rows, key=lambda k: (k[1] != "full", k[0])):
                  print("| " + " | ".join(rows[key]) + " |")
              print()

          print("## Coding Bench, checks")
          print()
          log = read("/tmp/pytest.log")
          tail = [l for l in log.splitlines() if any(k in l for k in ("passed", "failed", "error"))]
          restricted = read("/tmp/restricted.log").strip().splitlines()
          print("| Check | Result |")
          print("|---|---|")
          print(f"| Tier 0 tests | {tail[-1].strip() if tail else 'did not run'} |")
          print(f"| Metrics match predictions | {'${{ steps.rescore.outcome }}'} |")
          print(f"| Leaderboard current | {'${{ steps.leaderboard.outcome }}'} |")
          print(f"| Restricted data scan | {restricted[-1] if restricted else 'no coding_bench files changed'} |")
          print()

          board = read("coding_bench/results/LEADERBOARD.md")
          leader_table(board)

          match = re.search(r"^## Quarantined runs$(.*?)(?=^## |\Z)", board, re.M | re.S)
          table = [l for l in match.group(1).splitlines() if l.startswith("|")] if match else []
          if table:
              print("### Quarantined runs")
              print()
              print("\n".join(table))
              print()

          # The commit sha, not the branch: on a pull request the branch name is
          # a merge ref that does not resolve.
          print(
              "Every model, both frequency bands and the head to head: "
              "[LEADERBOARD.md](https://github.com/${{ github.repository }}/blob/"
              "${{ github.sha }}/coding_bench/results/LEADERBOARD.md)"
          )
          PY

  evaluate:
    # The gate. Without it, a red test suite still buys inference.
    needs: checks
    # Never on a pull request: fork PRs cannot see the secrets, and paying for
    # somebody else's branch is not something this repo should do by default.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      # Results live in git: the leaderboard is generated from committed run
      # records, so a run that cannot commit leaves the leaderboard untrue.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the guard below diffs the whole pushed range, and a
          # push of several commits is normal here.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e './coding_bench[dev,modal,anthropic]'

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Refuse a global re-run that nobody asked for
        if: inputs.confirm_full_rerun != true
        run: |
          # The whole pushed range, not just the tip. A push of five commits
          # where the second changes the prompt is exactly the case that would
          # otherwise slip through and re-infer the entire leaderboard.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"   # manual dispatch, or a new branch with no before
          fi
          echo "Inspecting $base..HEAD"
          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || true)
          if echo "$changed" | grep -qE 'coding_bench/(approaches/llm\.py|data/manifests/)'; then
            echo "::error::This change invalidates every model's cache (prompt or gold set), so running the set would re-infer the whole leaderboard. Dispatch manually with confirm_full_rerun: true if that is what you want."
            exit 1
          fi
          echo "No global cache invalidation in this change."

      - name: Evaluate the run set
        # Not on a collect dispatch, which is about banking a detached chain
        # and has no reason to walk the hosted set, on a cache hit still a
        # container start per configuration.
        if: inputs.action != 'collect'
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Every configuration on the leaderboard that is reached over HTTP.
          # GPU models are absent on purpose. Adding a line here is how a new
          # model joins the board.
          #
          # The last column is concurrency, blank to take the dispatch default.
          # It is per configuration because the ceiling it is set against is
          # tokens per minute rather than requests, so a model that generates
          # more per note saturates Groq at fewer workers. It is deliberately
          # excluded from the prediction cache key, so tuning it here re-runs
          # nothing.
          RUN_SET: |
            icd10 qwen3.6-27b   gold 16384
            icd10 qwen3.6-27b   full 16384
            icd10 gpt-oss-120b  gold 4096
            icd10 gpt-oss-120b  full 8192
            cpt   qwen3.6-27b   gold 16384
            cpt   qwen3.6-27b   full 16384
            cpt   gpt-oss-120b  gold 16384
            cpt   gpt-oss-120b  full 16384
            icd10 sonnet-5      gold 16384
            icd10 sonnet-5      full 16384
            cpt   sonnet-5      gold 16384
            cpt   sonnet-5      full 16384
            icd10 qwen3.8-27b   gold 16384 2
            icd10 qwen3.8-27b   full 16384 2
            cpt   qwen3.8-27b   gold 16384 2
            cpt   qwen3.8-27b   full 16384 2
        run: |
          set -o pipefail
          only="${{ inputs.only }}"
          conc="${{ inputs.concurrency }}"; conc="${conc:-3}"
          echo "$RUN_SET" | while read -r task model space max_tokens cell_conc; do
            [ -z "$task" ] && continue
            line="$task $model $space"
            if [ -n "$only" ] && ! echo "$line" | grep -q "$only"; then
              echo "skipping $line (filtered by '$only')"
              continue
            fi
            echo "::group::$line"
            # The cheap question, asked before anything is deployed or loaded.
            # The prediction cache answers "has this note been paid for" only
            # after a container has started and a dataset has loaded, and it
            # re-infers any note it misses. A push whose real work was four new
            # cells once walked twelve settled ones and re-inferred 383 notes
            # across them for $1.90 it did not need to spend. If a committed
            # record already covers this configuration at this adapter hash and
            # these parameters, and passed the failure ceiling, read the number
            # off the record and move on. confirm_full_rerun overrides it.
            if [ "${{ inputs.confirm_full_rerun }}" != "true" ] \
               && python -m coding_bench.bench.settled \
                    --task "$task" --model "$model" --space "$space" \
                    --max-tokens "$max_tokens"; then
              echo "::endgroup::"
              continue
            fi
            # max_tokens is per configuration and is in the cache key: a
            # different value misses every note and pays again for work already
            # done.
            modal run coding_bench/eval_remote.py \
              --task "$task" --model "$model" --candidate-space "$space" \
              --max-tokens "$max_tokens" --concurrency "${cell_conc:-$conc}" 2>&1 | tee -a /tmp/eval.log
            echo "::endgroup::"
          done

      - name: Collect finished detached runs
        if: inputs.action == 'collect'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          modal run coding_bench/run_chain.py::fetch 2>&1 | tee -a /tmp/eval.log

      - name: Rescore and regenerate
        # Neither step calls a model. Rescore first, so a metrics change reaches
        # every record rather than leaving the new one consistent and the older
        # ones stale.
        run: |
          python -m coding_bench.bench.rescore
          python -m coding_bench.bench.reporting

      - name: Guard the records before committing
        # README.md too: `reporting` regenerates the summary block in it, and
        # staging only the records would leave that block behind and fail the
        # next push's `reporting --check` on a file this job had already
        # rewritten and thrown away.
        run: |
          git add -A coding_bench/results README.md
          git diff --cached --name-only | xargs -r python coding_bench/scripts/check_restricted.py

      - name: Commit results
        run: |
          if git diff --cached --quiet; then
            echo "Nothing changed: every run was served from cache and the metrics already matched."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bank coding_bench results from CI"
          # Rebase before pushing. These runs are long enough that someone can
          # push meanwhile, and a rejected push after paid inference would
          # strand the result. The loop covers the window between the fetch and
          # the push, which is small but is exactly where a second pusher wins.
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            # --autostash because a rebase refuses to start on a dirty tree,
            # and only coding_bench/results is ever staged. Anything a build
            # step regenerates elsewhere would otherwise strand the records
            # with an error about a rebase that never began.
            if ! git rebase --autostash "origin/${{ github.ref_name }}"; then
              # The leaderboard is generated, so a conflict in it is not a
              # decision anyone needs to make. Take whatever upstream has and
              # regenerate below. During a rebase `ours` is upstream and
              # `theirs` is the commit being replayed, which is this one.
              # README.md is only partly generated, so taking upstream's copy
              # keeps any prose somebody landed meanwhile and the regeneration
              # below puts this run's numbers back between the markers.
              for generated in coding_bench/results/LEADERBOARD.md README.md; do
                git checkout --ours "$generated" 2>/dev/null || true
                git add "$generated" 2>/dev/null || true
              done
              # Anything still unmerged is a run record, and a record is
              # evidence. Staging those blind writes conflict markers into the
              # JSON, and reporting then skips the unreadable file, so the run
              # drops off the board and the job still goes green.
              unmerged=$(git diff --name-only --diff-filter=U)
              if [ -n "$unmerged" ]; then
                git rebase --abort
                echo "::error::Conflicting run records, nothing pushed: $(echo "$unmerged" | tr '\n' ' '). The records are in the run artifact and nothing is lost; merge them by hand."
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || {
                echo "::error::Rebase failed. The records are in the run artifact and nothing is lost; commit them by hand."
                exit 1
              }
            fi
            # After every rebase, conflicted or not. Upstream may have banked
            # records this commit has never seen, and the board is generated
            # from all of them, so skipping this pushes a stale board that
            # fails much later on somebody else's unrelated push.
            python -m coding_bench.bench.reporting
            git add -A coding_bench/results README.md
            git diff --cached --quiet || git commit --amend --no-edit
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected, so someone landed a commit while this rebased. Attempt $attempt of 3."
          done
          echo "::error::Push kept being rejected. The records are in the run artifact and nothing is lost; commit them by hand."
          exit 1

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, re

          def read(path, default=""):
              p = pathlib.Path(path)
              return p.read_text(encoding="utf8") if p.exists() else default

          def leaders(board):
              """The winning row under each `### task, space` heading."""
              # Scoped to the Results section: Frequency bands uses `###` per
              # run too, and those rows are not leaders of anything.
              section = re.search(r"^## Results$(.*?)(?=^## |\Z)", board, re.M | re.S)
              if not section:
                  return []
              out, heading = [], None
              for line in section.group(1).splitlines():
                  if line.startswith("### "):
                      heading = line[4:].strip()
                  elif heading and line.startswith("|"):
                      if set(line) <= set("|-: "):
                          continue
                      cells = [c.strip() for c in line.strip("|").split("|")]
                      if cells and cells[0] == "Model":
                          continue
                      out.append(cells)
                      heading = None
              return out

          def quarantine_rows(board):
              """Rows of the quarantine table: model, task, space, n, failed, trunc, f1."""
              match = re.search(r"^## Quarantined runs$(.*?)(?=^## |\Z)", board, re.M | re.S)
              out = []
              for line in (match.group(1).splitlines() if match else []):
                  if not line.startswith("|") or set(line) <= set("|-: "):
                      continue
                  cells = [c.strip() for c in line.strip("|").split("|")]
                  if cells and cells[0] != "Model":
                      out.append(cells)
              return out

          def leader_table(board):
              def cell(c, i):
                  return c[i] if len(c) > i else ""

              rows = {}
              for c in leaders(board):
                  rows[(cell(c, 1), cell(c, 2))] = [
                      cell(c, 1), cell(c, 2), cell(c, 0), cell(c, 3), cell(c, 4), cell(c, 10), "valid",
                  ]

              # A condition where every attempt was quarantined has no entry in
              # Results at all, so it would vanish from this table and read as
              # untried. Show the best attempt with the failure rate attached,
              # which is the one thing that stops the number being taken as a score.
              for c in sorted(quarantine_rows(board), key=lambda c: cell(c, 6), reverse=True):
                  key = (cell(c, 1), cell(c, 2))
                  if key in rows:
                      continue
                  rows[key] = [
                      cell(c, 1), cell(c, 2), cell(c, 0), cell(c, 3), cell(c, 6), "",
                      f"QUARANTINED, {cell(c, 4)} of notes failed",
                  ]

              if not rows:
                  return
              print("### Best model per condition")
              print()
              print("| Task | Candidates | Best model | n | Micro F1 [95% CI] | Latency | Status |")
              print("|---|---|---|---:|---|---:|---|")
              for key in sorted(rows, key=lambda k: (k[1] != "full", k[0])):
                  print("| " + " | ".join(rows[key]) + " |")
              print()

          print("## Coding Bench, evaluation")
          print()

          # What each configuration did. Every note a cache hit means the run
          # cost container time only, which is the normal case.
          log = read("/tmp/eval.log")
          rows, header = [], None
          for line in log.splitlines():
              if line.startswith("llm /"):
                  header = line.strip()
              elif header and line.strip().startswith("micro F1"):
                  rows.append(f"{header}\n    {line.strip()}")
                  header = None
          if rows:
              print("### This run")
              print()
              print("```")
              print("\n".join(rows))
              print("```")
              print()

          board = read("coding_bench/results/LEADERBOARD.md")
          leader_table(board)

          # Quarantined runs stay in the summary rather than behind the link.
          # A run that failed most of its notes still produces a full set of
          # plausible numbers, so it has to be visible where the numbers are.
          match = re.search(r"^## Quarantined runs$(.*?)(?=^## |\Z)", board, re.M | re.S)
          table = [l for l in match.group(1).splitlines() if l.startswith("|")] if match else []
          if table:
              print("### Quarantined runs")
              print()
              print("\n".join(table))
              print()

          print(
              "Every model, both frequency bands and the head to head: "
              "[LEADERBOARD.md](https://github.com/${{ github.repository }}/blob/"
              "${{ github.ref_name }}/coding_bench/results/LEADERBOARD.md)"
          )
          PY

      - name: Pack the results
        if: always()
        # Model ids become file names, and some of them carry a colon, which
        # upload-artifact rejects. It refuses the entire upload rather than the
        # one file, so the artifact that every error message above promises was
        # missing on the first run that needed it. A tar has no such rule.
        # Predictions are the local cache and are excluded, as they are large
        # and are gitignored for the same reason.
        run: tar -czf /tmp/coding-bench-results.tar.gz --exclude=predictions -C coding_bench/results .

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-bench-results
          path: /tmp/coding-bench-results.tar.gz
          if-no-files-found: warn
